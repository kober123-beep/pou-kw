    <style>
        body {
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0f172a;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        img {
            pointer-events: none;
        }
    </style>
</head>

    <!-- JAVASCRIPT GAME LOGIC -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSqueak() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playEat() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.setValueAtTime(350, this.ctx.currentTime + 0.05);
                osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playBubble() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400 + Math.random() * 400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800 + Math.random() * 200, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCoin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }

            playLevelUp() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }

            playBoing() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }
        }

        const sounds = new SoundEngine();

                { id: 'glasses', name: 'Kacamata Hitam', icon: '🕶️', price: 180 }

        const defaultState = {

            coins: 150,
            level: 1,
            xp: 0,
            room: 'kitchen',
            inventory: {

                hats: ['none']
            },
            equipped: {
                color: '#d97706',
                hat: 'none'
            },
            isLampOff: false,
            poopPiles: []
        };

        let state = JSON.parse(localStorage.getItem('pou_game_state')) || defaultState;

        function saveState() {
            localStorage.setItem('pou_game_state', JSON.stringify(state));
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width = 0, height = 0;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            width = rect.width;
            height = rect.height;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);

        const drag = {
            active: false,
            type: null,
            itemId: null,
            x: 0,
            y: 0,
            offsetX: 0,
            offsetY: 0
        };

        const ball = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            radius: 26,
            isDragging: false
        };

        const pouAnim = {
            bounceY: 0,
            bounceVy: 0,
            squishX: 1,
            squishY: 1,
            chewTimer: 0,
            suds: [],
            dirt: 0,
            particles: []
        };

        function drawBackground() {
            ctx.save();
            if (state.room === 'kitchen') {
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#fef3c7');
                grad.addColorStop(1, '#fde68a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.strokeStyle = 'rgba(217, 119, 6, 0.15)';
                ctx.lineWidth = 2;
                const tileSize = 40;
                for (let x = 0; x < width; x += tileSize) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                }
                for (let y = 0; y < height; y += tileSize) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                }

                ctx.fillStyle = '#b45309';
                ctx.fillRect(0, height - 70, width, 70);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(0, height - 70, width, 12);
            } else if (state.room === 'bathroom') {
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#e0f2fe');
                grad.addColorStop(1, '#bae6fd');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for (let i = 0; i < 6; i++) {
                    const bx = (width * 0.2 * i + Date.now() * 0.02) % width;
                    const by = (height * 0.15 * i + Math.sin(Date.now() * 0.002 + i) * 20) % height;
                    ctx.beginPath();
                    ctx.arc(bx, by, 15 + i * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#0284c7';
                ctx.fillRect(0, height - 60, width, 60);
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(0, height - 60, width, 10);
            } else if (state.room === 'bedroom') {
                if (state.isLampOff) {
                    const grad = ctx.createLinearGradient(0, 0, 0, height);
                    grad.addColorStop(0, '#0f172a');
                    grad.addColorStop(1, '#1e1b4b');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, width, height);

                    ctx.fillStyle = '#fef08a';
                    for (let i = 0; i < 15; i++) {
                        const sx = (i * 37) % width;
                        const sy = (i * 23) % (height * 0.6);
                        ctx.beginPath();
                        ctx.arc(sx, sy, (i % 2 === 0) ? 2 : 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    const grad = ctx.createLinearGradient(0, 0, 0, height);
                    grad.addColorStop(0, '#f3e8ff');
                    grad.addColorStop(1, '#e9d5ff');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, width, height);
                }

                ctx.fillStyle = state.isLampOff ? '#312e81' : '#a855f7';
                ctx.fillRect(0, height - 60, width, 60);
                ctx.fillStyle = state.isLampOff ? '#4338ca' : '#c084fc';
                ctx.fillRect(0, height - 60, width, 10);
            } else if (state.room === 'playroom') {
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#f0fdf4');
                grad.addColorStop(1, '#dcfce7');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(0, height - 60, width, 60);
                ctx.fillStyle = '#4ade80';
                ctx.fillRect(0, height - 60, width, 10);
            }
            ctx.restore();
        }

        function drawPou(cx, cy, radius) {
            ctx.save();
            ctx.translate(cx, cy + pouAnim.bounceY);
            ctx.scale(pouAnim.squishX, pouAnim.squishY);

            ctx.beginPath();
            const topY = -radius * 0.95;
            const bottomY = radius * 0.9;
            const leftX = -radius * 1.05;
            const rightX = radius * 1.05;

            ctx.moveTo(0, topY);
            ctx.bezierCurveTo(radius * 0.7, topY, rightX, -radius * 0.2, rightX, bottomY * 0.6);
            ctx.bezierCurveTo(rightX, bottomY * 1.1, -rightX, bottomY * 1.1, leftX, bottomY * 0.6);
            ctx.bezierCurveTo(leftX, -radius * 0.2, -radius * 0.7, topY, 0, topY);
            ctx.closePath();

            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 12;

            ctx.fillStyle = state.equipped.color;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Eyes
            const eyeOffsetX = radius * 0.35;
            const eyeOffsetY = -radius * 0.15;
            const eyeRadius = radius * 0.22;

            [ -eyeOffsetX, eyeOffsetX ].forEach(ex => {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(ex, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Pupil
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                if (state.isLampOff) {
                    ctx.arc(ex, eyeOffsetY, eyeRadius * 0.3, 0, Math.PI * 2);
                } else {
                    ctx.arc(ex + 1, eyeOffsetY + 1, eyeRadius * 0.45, 0, Math.PI * 2);
                }
                ctx.fill();

                // Pupil Catchlight
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(ex - 2, eyeOffsetY - 2, eyeRadius * 0.15, 0, Math.PI * 2);
                ctx.fill();
            });

            // Mouth
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3.5;
            ctx.beginPath();

            if (pouAnim.chewTimer > 0) {
                ctx.ellipse(0, radius * 0.25, 12, 8, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#f43f5e';
                ctx.fill();
            } else if (state.stats.hunger < 30 || state.stats.cleanliness < 30) {
                ctx.arc(0, radius * 0.4, 14, Math.PI * 1.1, Math.PI * 1.9, true);
            } else {
                ctx.arc(0, radius * 0.18, 14, 0.1 * Math.PI, 0.9 * Math.PI, false);
            }
            ctx.stroke();

            // Hat Overlay
            if (state.equipped.hat === 'crown') {
                ctx.font = `${radius * 0.8}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText('👑', 0, -radius * 0.75);
            } else if (state.equipped.hat === 'cap') {
                ctx.font = `${radius * 0.8}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText('🧢', 0, -radius * 0.75);
            } else if (state.equipped.hat === 'party') {
                ctx.font = `${radius * 0.8}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText('🎉', 0, -radius * 0.75);
            } else if (state.equipped.hat === 'glasses') {
                ctx.font = `${radius * 0.7}px serif`;
                ctx.textAlign = 'center';
                ctx.fillText('🕶️', 0, -radius * 0.1);
            }

            // Soap suds overlay
            pouAnim.suds.forEach(sud => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(sud.x, sud.y, sud.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('levelBadge').innerText = state.level;
            document.getElementById('xpBar').style.width = `${Math.min(100, (state.xp / (state.level * 100)) * 100)}%`;
            document.getElementById('coinCount').innerText = state.coins;

            document.getElementById('hungerVal').innerText = `${Math.round(state.stats.hunger)}%`;
            document.getElementById('hungerBar').style.width = `${state.stats.hunger}%`;

            document.getElementById('energyVal').innerText = `${Math.round(state.stats.energy)}%`;
            document.getElementById('energyBar').style.width = `${state.stats.energy}%`;

            document.getElementById('cleanVal').innerText = `${Math.round(state.stats.cleanliness)}%`;
            document.getElementById('cleanBar').style.width = `${state.stats.cleanliness}%`;

            document.getElementById('funVal').innerText = `${Math.round(state.stats.fun)}%`;
            document.getElementById('funBar').style.width = `${state.stats.fun}%`;

            const roomBadge = document.getElementById('roomName');
            const roomIcon = document.getElementById('roomIcon');
            if (state.room === 'kitchen') {
                roomBadge.innerText = 'Dapur'; roomIcon.innerText = '🍽️';
            } else if (state.room === 'bathroom') {
                roomBadge.innerText = 'Kamar Mandi'; roomIcon.innerText = '301'; roomIcon.innerText = '🛁';
            } else if (state.room === 'bedroom') {
                roomBadge.innerText = 'Kamar Tidur'; roomIcon.innerText = '🛏️';
            } else if (state.room === 'playroom') {
                roomBadge.innerText = 'Ruang Bermain'; roomIcon.innerText = '⚽';
            }

            renderActivityTray();
        }

        function renderActivityTray() {
            const tray = document.getElementById('activityTray');
            tray.innerHTML = '';

            if (state.room === 'kitchen') {
                CATALOG.food.forEach(item => {
                    const count = state.inventory.food[item.id] || 0;
                    const btn = document.createElement('button');
                    btn.className = `flex flex-col items-center justify-center p-2 rounded-xl border transition ${count > 0 ? 'bg-white hover:bg-amber-50 border-amber-200' : 'bg-slate-100 opacity-50'}`;
                    btn.innerHTML = `<span class="text-2xl">${item.icon}</span><span class="text-[10px] font-bold text-slate-700">x${count}</span>`;
                    btn.onclick = () => {
                        if (count > 0) {
                            drag.active = true;
                            drag.type = 'food';
                            drag.itemId = item.id;
                            drag.x = width / 2;
                            drag.y = height / 2;
                        }
                    };
                    tray.appendChild(btn);
                });
            } else if (state.room === 'bathroom') {
                const soapBtn = document.createElement('button');
                soapBtn.className = 'flex flex-col items-center justify-center p-2 px-4 rounded-xl bg-sky-100 hover:bg-sky-200 border border-sky-300 font-bold text-xs text-sky-800';
                soapBtn.innerHTML = '<span class="text-2xl">🧼</span><span>Sabun</span>';
                soapBtn.onclick = () => {
                    drag.active = true;
                    drag.type = 'soap';
                    drag.x = width / 2;
                    drag.y = height / 2;
                };

                const showerBtn = document.createElement('button');
                showerBtn.className = 'flex flex-col items-center justify-center p-2 px-4 rounded-xl bg-blue-100 hover:bg-blue-200 border border-blue-300 font-bold text-xs text-blue-800';
                showerBtn.innerHTML = '<span class="text-2xl">🚿</span><span>Bilas</span>';
                showerBtn.onclick = () => {
                    drag.active = true;
                    drag.type = 'shower';
                    drag.x = width / 2;
                    drag.y = height / 2;
                };

                tray.appendChild(soapBtn);
                tray.appendChild(showerBtn);
            } else if (state.room === 'bedroom') {
                const lampBtn = document.createElement('button');
                lampBtn.className = `flex items-center gap-2 p-2 px-5 rounded-xl font-bold text-xs ${state.isLampOff ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-white'}`;
                lampBtn.innerHTML = `<span>${state.isLampOff ? '💡' : '🌙'}</span><span>${state.isLampOff ? 'Nyalakan Lampu' : 'Matikan Lampu'}</span>`;
                lampBtn.onclick = () => {
                    state.isLampOff = !state.isLampOff;
                    sounds.playSqueak();
                    saveState();
                    updateUI();
                };
                tray.appendChild(lampBtn);
            } else if (state.room === 'playroom') {
                const gameBtn = document.createElement('button');
                gameBtn.className = 'flex items-center gap-2 p-2 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs shadow-md';
                gameBtn.innerHTML = '<span>🎮</span><span>Mini Game</span>';
                gameBtn.onclick = startMiniGame;

                const ballBtn = document.createElement('button');
                ballBtn.className = 'flex items-center gap-2 p-2 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs shadow-md';
                ballBtn.innerHTML = '<span>⚽</span><span>Bola</span>';
                ballBtn.onclick = () => {
                    ball.x = width / 2;
                    ball.y = height / 3;
                    ball.vx = (Math.random() - 0.5) * 10;
                    ball.vy = -5;
                };

                tray.appendChild(gameBtn);
                tray.appendChild(ballBtn);
            }
        }

        // Main Loop & Interactions
        function animate() {
            ctx.clearRect(0, 0, width, height);
            drawBackground();

            const pouX = width / 2;
            const pouY = height / 2 + 20;
            const pouRadius = Math.min(width, height) * 0.22;

            drawPou(pouX, pouY, pouRadius);

            // Dragged items rendering
            if (drag.active) {
                ctx.save();
                ctx.font = '40px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (drag.type === 'food') {
                    const item = CATALOG.food.find(f => f.id === drag.itemId);
                    if (item) ctx.fillText(item.icon, drag.x, drag.y);
                } else if (drag.type === 'soap') {
                    ctx.fillText('🧼', drag.x, drag.y);
                } else if (drag.type === 'shower') {
                    ctx.fillText('🚿', drag.x, drag.y);
                    // Water drops
                    ctx.fillStyle = '#38bdf8';
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.arc(drag.x + (Math.random() - 0.5) * 20, drag.y + 25 + Math.random() * 20, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }

            // Ball Physics in Playroom
            if (state.room === 'playroom' && (ball.x !== 0 || ball.y !== 0)) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.4; // gravity
                ball.vx *= 0.98; // friction

                if (ball.y + ball.radius > height - 60) {
                    ball.y = height - 60 - ball.radius;
                    ball.vy = -ball.vy * 0.7;
                }
                if (ball.x - ball.radius < 0 || ball.x + ball.radius > width) {
                    ball.vx = -ball.vx;
                }

                ctx.save();
                ctx.font = '45px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⚽', ball.x, ball.y);
                ctx.restore();
            }

            // Stat degradation and sleeping recovery
            if (state.isLampOff && state.room === 'bedroom') {
                state.stats.energy = Math.min(100, state.stats.energy + 0.05);
            } else {
                state.stats.hunger = Math.max(0, state.stats.hunger - 0.003);
                state.stats.energy = Math.max(0, state.stats.energy - 0.002);
                state.stats.cleanliness = Math.max(0, state.stats.cleanliness - 0.002);
                state.stats.fun = Math.max(0, state.stats.fun - 0.003);
            }

            if (pouAnim.chewTimer > 0) pouAnim.chewTimer--;

            requestAnimationFrame(animate);
        }

        // Pointer event listeners for dragging
        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            if (drag.active) {
                drag.x = px;
                drag.y = py;

                const pouX = width / 2;
                const pouY = height / 2 + 20;
                const dist = Math.hypot(px - pouX, py - pouY);

                if (dist < 80) {
                    if (drag.type === 'food') {
                        state.inventory.food[drag.itemId]--;
                        const item = CATALOG.food.find(f => f.id === drag.itemId);
                        state.stats.hunger = Math.min(100, state.stats.hunger + item.hunger);
                        state.xp += item.exp;
                        sounds.playEat();
                        pouAnim.chewTimer = 30;
                        drag.active = false;
                        saveState();
                        updateUI();
                    } else if (drag.type === 'soap') {
                        sounds.playBubble();
                        if (pouAnim.suds.length < 15) {
                            pouAnim.suds.push({ x: (px - pouX), y: (py - pouY), size: 8 + Math.random() * 8 });
                        }
                    } else if (drag.type === 'shower') {
                        if (pouAnim.suds.length > 0) {
                            pouAnim.suds.pop();
                            state.stats.cleanliness = Math.min(100, state.stats.cleanliness + 3);
                            sounds.playBubble();
                            saveState();
                            updateUI();
                        }
                    }
                }
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            const pouX = width / 2;
            const pouY = height / 2 + 20;

            if (Math.hypot(px - pouX, py - pouY) < 80) {
                sounds.playSqueak();
                pouAnim.bounceY = -15;
            }
        });

        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', () => { drag.active = false; });

        // Room Navigation Setup
        document.querySelectorAll('.room-nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.room-nav-btn').forEach(b => {
                    b.classList.remove('active', 'bg-amber-500', 'text-white', 'shadow-md');
                    b.classList.add('text-slate-600');
                });
                btn.classList.add('active', 'bg-amber-500', 'text-white', 'shadow-md');
                btn.classList.remove('text-slate-600');
                state.room = btn.dataset.room;
                sounds.playSqueak();
                saveState();
                updateUI();
            });
        });

        // Shop System Setup
        const shopModal = document.getElementById('shopModal');
        document.getElementById('shopBtn').onclick = () => {
            shopModal.classList.remove('hidden');
            renderShop('food');
        };
        document.getElementById('closeShopBtn').onclick = () => shopModal.classList.add('hidden');

        function renderShop(tab) {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const items = CATALOG[tab];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col items-center justify-between text-center';
                if (tab === 'food') {
                    card.innerHTML = `
                        <span class="text-3xl mb-1">${item.icon}</span>
                        <span class="font-bold text-xs text-slate-800">${item.name}</span>
                        <span class="text-[10px] text-emerald-600 font-bold mb-2">+${item.hunger} Lapar</span>
                        <button class="w-full py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1">
                            <span>🪙</span> ${item.price}
                        </button>
                    `;
                    card.querySelector('button').onclick = () => {
                        if (state.coins >= item.price) {
                            state.coins -= item.price;
                            state.inventory.food[item.id] = (state.inventory.food[item.id] || 0) + 1;
                            sounds.playCoin();
                            saveState();
                            updateUI();
                        }
                    };
                }
                grid.appendChild(card);
            });
        }

        // Mini Game System
        let miniGameActive = false;
        function startMiniGame() {
            document.getElementById('miniGameModal').classList.remove('hidden');
            miniGameActive = true;
        }
        document.getElementById('exitGameBtn').onclick = () => {
            document.getElementById('miniGameModal').classList.add('hidden');
            miniGameActive = false;
        };

        // Initialize App
        resizeCanvas();
        updateUI();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
